services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: desafio_dados_postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-desafio_dados}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    ports:
      - "${POSTGRES_PORT:-5433}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: desafio_dados_mongo
    restart: unless-stopped

    ports:
      - "${MONGO_PORT:-27018}:27017"

    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data: